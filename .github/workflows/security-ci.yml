name: Security CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  NUGET_XMLDOC_MODE: skip

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          package-manager-cache: false

      - name: Install root tooling from lockfile
        run: npm ci --ignore-scripts

      - name: Install frontend from lockfile
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium

      - name: End-to-end tests
        id: e2e
        working-directory: frontend
        run: npm run e2e

      - name: Upload Playwright report after an E2E failure
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.sha }}
          path: frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASPNETCORE_ENVIRONMENT: Development
      CI_DB_PASSWORD: miga-ci-${{ github.run_id }}-${{ github.run_attempt }}
      ConnectionStrings__MigaDatabase: Host=localhost;Port=5432;Database=miga_ci;Username=miga_ci;Password=miga-ci-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      postgres:
        image: postgres:17.10-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
        env:
          POSTGRES_DB: miga_ci
          POSTGRES_USER: miga_ci
          POSTGRES_PASSWORD: miga-ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miga_ci -d miga_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Restore locked dependencies
        run: dotnet restore backend/Miga.slnx --locked-mode

      - name: Audit NuGet dependencies
        run: dotnet list backend/Miga.slnx package --vulnerable --include-transitive --no-restore

      - name: Check formatting
        run: dotnet format backend/Miga.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build backend/Miga.slnx --configuration Release --no-restore

      - name: Verify migration snapshot matches the model
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project backend/src/Miga.Infrastructure
          --startup-project backend/src/Miga.Api
          --configuration Release
          --no-build

      - name: Apply migrations twice to ephemeral PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            dotnet ef database update \
              --project backend/src/Miga.Infrastructure \
              --startup-project backend/src/Miga.Api \
              --configuration Release \
              --no-build
          done

      - name: Generate and inspect idempotent migration artifact
        shell: bash
        run: |
          set -euo pipefail
          migration_script="$RUNNER_TEMP/miga-migrations.sql"
          dotnet ef migrations script \
            --idempotent \
            --project backend/src/Miga.Infrastructure \
            --startup-project backend/src/Miga.Api \
            --configuration Release \
            --no-build \
            --output "$migration_script"
          test -s "$migration_script"
          if grep -Fq "$CI_DB_PASSWORD" "$migration_script"; then
            echo "::error::The generated migration contains its ephemeral database credential."
            exit 1
          fi
          if awk '
            toupper($0) ~ /^[[:space:]]*(INSERT|COPY)[[:space:]]/ &&
            $0 !~ /__EFMigrationsHistory/ { found = 1 }
            END { exit !found }
          ' "$migration_script"; then
            echo "::error::The generated migration contains data statements outside EF migration history."
            exit 1
          fi
          (
            cd "$RUNNER_TEMP"
            sha256sum miga-migrations.sql > miga-migrations.sql.sha256
          )

      - name: Upload reviewed migration artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: miga-idempotent-migration-${{ github.sha }}
          path: |
            ${{ runner.temp }}/miga-migrations.sql
            ${{ runner.temp }}/miga-migrations.sql.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Test
        id: backend-tests
        run: dotnet test backend/Miga.slnx --configuration Release --no-build --no-restore --collect:"XPlat Code Coverage"

      - name: Upload backend coverage
        if: ${{ !cancelled() && steps.backend-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-${{ github.sha }}
          path: backend/**/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan tracked history
        shell: bash
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1'

  container-image:
    name: PostgreSQL image scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify Trivy
        shell: bash
        env:
          TRIVY_VERSION: 0.72.0
          TRIVY_SHA256: bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy

      - name: Scan the pinned PostgreSQL image
        shell: bash
        env:
          POSTGRES_IMAGE: postgres:17.10-alpine3.23@sha256:8189a1f6e40904781fc9e2612687877791d21679866db58b1de996b31fc312e4
        run: |
          "$RUNNER_TEMP/trivy" image \
            --image-src remote \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            --timeout 10m \
            "$POSTGRES_IMAGE"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0
        with:
          languages: csharp,javascript-typescript
          queries: security-extended

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          package-manager-cache: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install frontend from lockfile
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Restore backend from lockfile
        run: dotnet restore backend/Miga.slnx --locked-mode

      - name: Build backend
        run: dotnet build backend/Miga.slnx --configuration Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0
